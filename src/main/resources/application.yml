spring:
  application.name: salary-management
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:salary_management}}
    username: ${DATABASE_USERNAME:${DB_USER:salary}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:salary}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.batch_size: 100
  servlet.multipart.max-file-size: 5MB
management.endpoints.web.exposure.include: health,info
management.endpoint.health.probes.enabled: true
server:
  port: ${PORT:8080}
  error.include-message: never
app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  reporting-currency: ${REPORTING_CURRENCY:USD}
  demo:
    username: ${DEMO_USERNAME:hr@acme.test}
    password: ${DEMO_PASSWORD:ChangeMe123!}
  seed:
    enabled: ${SEED_ENABLED:true}
    employee-count: ${SEED_EMPLOYEE_COUNT:10000}
