services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salary_management
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: salary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary -d salary_management"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [salary-data:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DB_HOST: database
      DEMO_USERNAME: hr@acme.test
      DEMO_PASSWORD: ChangeMe123!
      ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8081
    ports: ["8080:8080"]
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build: frontend
    ports: ["8081:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  salary-data:

